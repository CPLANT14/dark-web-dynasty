<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dark Web Dynasty // League Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--g:#02ff42;--dim:#3bae60;--deep:#102e16;--amber:#ffb000;--bg:#070a07;--plate:#0d120d;--w:#f0f5f0}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--w);font:14px/1.5 'Fira Code',monospace;background-image:linear-gradient(rgba(18,32,18,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(18,32,18,.5) 1px,transparent 1px);background-size:50px 50px;min-height:100vh}
h1,h2,h3,.rus{font-family:'Russo One',sans-serif;font-weight:400}
a{color:inherit;text-decoration:none}
.top{position:sticky;top:0;z-index:20;background:rgba(7,10,7,.96);border-bottom:1px solid var(--deep);backdrop-filter:blur(4px)}
.bar{max-width:1200px;margin:auto;display:flex;align-items:center;gap:18px;padding:12px 20px;flex-wrap:wrap}
.logo{color:var(--g);font:16px 'Russo One';letter-spacing:2px;margin-right:auto}.logo small{display:block;color:var(--dim);font:10px 'Fira Code';letter-spacing:3px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a,.dd>button{background:none;border:1px solid transparent;color:var(--dim);font:13px 'Fira Code';letter-spacing:1px;padding:8px 12px;cursor:pointer;display:block}
.nav a:hover,.dd>button:hover{color:var(--g);border-color:var(--deep)}
.nav a.on,.dd.on>button{color:#000;background:var(--g)}
.dd{position:relative}.dd .m{display:none;position:absolute;right:0;top:100%;background:var(--plate);border:1px solid var(--deep);min-width:260px;z-index:30}
.dd:hover .m,.dd:focus-within .m{display:block}.dd .m a{padding:11px 14px;color:var(--w);border-bottom:1px solid var(--deep)}.dd .m a small{display:block;color:var(--dim);font-size:11px}.dd .m a:hover{background:var(--deep);color:var(--g)}
main{max-width:1200px;margin:auto;padding:30px 20px 80px}
.hero{text-align:center;padding:34px 0 10px}
.hero h1{font-size:clamp(34px,7vw,70px);color:var(--g);letter-spacing:2px;text-shadow:0 0 24px rgba(2,255,66,.35)}
.hero p{color:var(--dim);letter-spacing:3px;margin-top:10px;font-size:12px}
.hero .lead{color:var(--w);letter-spacing:0;max-width:560px;margin:16px auto 0;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:28px 0}
.tile{border:1px solid var(--deep);border-left:4px solid var(--g);background:var(--plate);padding:18px;transition:.15s;display:block}
.tile:hover{transform:translateY(-3px);border-color:var(--g);box-shadow:0 6px 30px rgba(2,255,66,.15)}
.tile h3{color:var(--g);font-size:17px;margin-bottom:6px}.tile p{color:var(--dim);font-size:12px}.tile .tag{float:right;font-size:10px;border:1px solid var(--amber);color:var(--amber);padding:1px 6px}
.sec{border:2px solid var(--deep);border-left:4px solid var(--g);background:var(--plate);padding:14px 20px;margin:6px 0 16px}
.sec h2{color:var(--g);font-size:clamp(18px,3vw,26px)}.sec p{color:var(--dim);font-size:12px;margin-top:4px}
.box{border:1px solid var(--deep);background:var(--plate);padding:16px;margin-bottom:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--deep);white-space:nowrap}th{color:var(--dim);font-size:11px;letter-spacing:1px;cursor:default}th[data-k]{cursor:pointer}th[data-k]:hover{color:var(--g)}
.n{text-align:center}td img.av{width:24px;height:24px;border-radius:50%;vertical-align:middle;margin-right:8px;border:1px solid var(--deep)}
.me td{background:rgba(2,255,66,.06)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border:1px solid var(--dim);color:var(--dim)}
.pill.trade{color:var(--amber);border-color:var(--amber)}.pill.waiver{color:var(--g);border-color:var(--g)}
.feed div.row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--deep);flex-wrap:wrap}
.feed .t{color:var(--dim);width:64px;flex:none;font-size:12px}.feed .who img{width:20px;height:20px;border-radius:50%;vertical-align:middle;margin-right:5px}
.feed .d{color:#b9cbbd;font-size:12px;flex:1;min-width:200px}.plus{color:var(--g)}.minus{color:#ff6b6b}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input,select,button.b{background:#000;color:var(--w);border:1px solid var(--deep);padding:8px 10px;font:13px 'Fira Code'}
button.b{color:#000;background:var(--g);border:0;cursor:pointer;font-weight:600;padding:9px 16px}button.b:hover{box-shadow:0 0 18px rgba(2,255,66,.4)}
.oddsbar{display:inline-block;height:8px;background:var(--g);vertical-align:middle;margin-right:6px;min-width:2px}
.win{border:2px solid var(--amber);padding:18px;text-align:center;margin-top:14px;background:#1a1400}.win b{color:var(--amber);font:26px 'Russo One'}
.stat{display:flex;gap:26px;flex-wrap:wrap;color:var(--dim);font-size:12px;margin-bottom:10px}.stat b{color:var(--g)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{background:var(--plate);color:var(--dim);border:1px solid var(--deep);padding:8px 14px;font:13px 'Fira Code';cursor:pointer}.tabs button.on{background:var(--g);color:#000}
.bars .r{display:flex;align-items:center;gap:10px;margin:6px 0}.bars img{width:24px;height:24px}.bars .nm{width:38px}.bars .tr{flex:1;background:#050805;height:18px;border:1px solid var(--deep)}.bars .tr i{display:block;height:100%;background:linear-gradient(90deg,#14702b,var(--g))}.bars .c{width:56px;text-align:right;color:var(--dim)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.path{display:grid;grid-template-columns:1fr 1fr;gap:6px}.lbl{grid-column:1/-1;font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:6px}
.tm{display:flex;align-items:center;gap:6px;background:#050805;border:1px solid var(--deep);padding:5px 8px}.tm img{width:22px;height:22px}.tm.win2{border-color:var(--amber);color:var(--amber);grid-column:1/-1;justify-content:center}
.vouchers{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}.vouchers a{border:1px solid var(--deep);display:block}.vouchers a:hover{border-color:var(--g)}.vouchers img{width:100%;display:block}
.note{color:var(--dim);font-size:12px;margin:8px 0}.empty{color:var(--dim);padding:20px;text-align:center}
footer{text-align:center;color:var(--dim);font-size:11px;letter-spacing:2px;padding:40px 20px}
.page{display:none}.page.on{display:block}
@media(max-width:640px){.bar{gap:8px}.logo{width:100%}.nav a,.dd>button{padding:7px 9px;font-size:12px}.dd .m{right:auto;left:0}}
</style></head><body>

function market(s){const trades=s.tx.filter(x=>x.type=='trade');return `<div class="sec"><h2>Market Surge</h2><p>One entry per trade, for every manager involved. Draw a winner weighted by entries.</p></div>

function marketCalc(s){const f=Date.parse($('mf').value+'T00:00:00Z'),t=Date.parse($('mt').value+'T00:00:00Z')+864e5;
