function tradeArt(sd){const c=TH.trade;
 return `<div class="img fade tr" style="background:radial-gradient(circle at 50% 0%,${c[1]}2a,${c[0]} 60%,#050805),repeating-linear-gradient(45deg,transparent 0 14px,${c[1]}0d 14px 15px)">
<div class="tcols">${sd.sides.map((s,i)=>`${i?`<div class="sw">⇄</div>`:''}<div class="tc"><div class="th2"><img src="${avf(s.av)}" onerror="this.style.visibility='hidden'"><b>${s.u}<small>RECEIVES</small></b></div><ul>${s.as.slice(0,5).map(a=>`<li>${a.pk?`<span class="pkc"><i>${String(a.y).slice(2)}</i><b>R${a.pk}</b></span>`:`<img class="hs" src="https://sleepercdn.com/content/nfl/players/thumb/${a.id}.jpg" onerror="this.outerHTML='<span class=&quot;hs ini&quot;>'+this.nextSibling.textContent.trim()[0]+'</span>'">`}<span>${a.n}</span></li>`).join('')||'<li>nothing listed</li>'}${s.as.length>5?`<li style="color:#9fb3a6">+${s.as.length-5} more</li>`:''}</ul></div>`).join('')}</div>
<div class="lb">${sd.c}</div></div>`}
function matchArt(sd){const [A,B]=sd.m,side=(x,c)=>`<div class="ms" style="--c:${c}"><img src="${avf(x.av)}" onerror="this.style.visibility='hidden'"><b>${x.u}</b><em>${x.rec}</em>${sd.st?`<strong>${x.p.toFixed(1)}</strong>`:`<strong style="font-size:15px;opacity:.8">${x.pf.toFixed(0)} PF</strong>`}</div>`;
 return `<div class="img fade mt" style="background:linear-gradient(105deg,#06203a 0 49.5%,#fff 49.5% 50.5%,#3a0a0a 50.5%)"><div class="mrow">${side(A,'#3aa0ff')}<div class="vs">VS</div>${side(B,'#ff5a5a')}</div><div class="lb">${sd.c}</div></div>`}
function art(sd){if(sd.t=='trade'&&sd.sides)return tradeArt(sd);if(sd.t=='match'&&sd.m)return matchArt(sd);
 const c=TH[sd.t]||TH.lead,img=h=>`<img class="gi" src="${avf(h)}" style="border-color:${c[1]}" onerror="this.style.visibility='hidden'">`;
 const left=sd.pod?`<div class="pod">${sd.pod.map((p,i)=>`<div class="pc" style="--h:${[70,100,55][i]}%"><img src="${avf(p.av)}" style="border-color:${c[1]}" onerror="this.style.visibility='hidden'"><small>${p.user}</small><div class="bar" style="background:${c[1]}33;border-color:${c[1]}"><b>${[2,1,3][i]}</b></div></div>`).join('')}</div>`:img(sd.a);
 const cap=sd.pod?'':`<small class="cap">${(ST_NAME[sd.a]||'')}</small>`;
 return `<div class="img fade gen" style="background:radial-gradient(circle at 78% 45%,${c[1]}30,${c[0]} 58%,#050805),repeating-linear-gradient(45deg,transparent 0 14px,${c[1]}0d 14px 15px)">
<svg class="wm" viewBox="0 0 200 200" fill="none" stroke="${c[1]}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${ICON[sd.t]||''}</svg>
${sd.noav?'':`<div class="gl">${left}${cap}</div>`}
${sd.stat?`<div class="gr"><div class="sv" style="color:${c[1]}">${sd.stat.v}</div><div class="sl">${sd.stat.l}</div></div>`:''}
<div class="lb">${sd.c}</div></div>`}
function newsHTML(){const sd=ST[SI],n=ST.length;
 return `<div class="main"><div class="hd"><b>Top Stories [${n}]</b><span class="ct"><i>${SI+1}</i> of ${n}</span></div>
${art(sd)}
<div class="hl"><h2>${sd.h}</h2></div><div class="bd fade">${sd.b}</div></div>
<div class="side">${ST.map((t,i)=>`<div class="it ${i==SI?'on':''}" data-i="${i}"><i class="th" style="background:${TH[t.t][0]};border-color:${TH[t.t][1]}"><svg viewBox="0 0 200 200" fill="none" stroke="${TH[t.t][1]}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">${ICON[t.t]}</svg></i><div><b>${t.k}</b><span>${t.h}</span></div></div>`).join('')}</div>
`}
function newsSet(i){SI=(i+ST.length)%ST.length;const el=$('nw');if(el){el.innerHTML=newsHTML();bindNews()}}
function bindNews(){const el=$('nw');el.querySelectorAll('.it').forEach(e=>e.onclick=()=>{newsSet(+e.dataset.i);clearInterval(STM);STM=setInterval(()=>newsSet(SI+1),9000)});const on=el.querySelector('.it.on');if(on&&el.querySelector('.side').scrollWidth>el.querySelector('.side').clientWidth)on.parentNode.scrollLeft=on.offsetLeft-10;const m=el.querySelector('.main'),s=el.querySelector('.side');if(m&&s)s.style.maxHeight=matchMedia('(max-width:760px)').matches?'':m.offsetHeight+'px'}
function newsInit(){clearInterval(STM);SI=0;const el=$('nw');if(!el)return;el.innerHTML=newsHTML();bindNews();STM=setInterval(()=>{if(!$('nw')||!$('p-home').classList.contains('on'))return;newsSet(SI+1)},9000)}

const done={};
async function route0(){if(/^#\/(standings|calendar)$/.test(location.hash))history.replaceState(null,'','#/');const p=(location.hash.replace('#/','')||'home');const pg=PAGES.includes(p)?p:'home';
 document.querySelectorAll('.page').forEach(e=>e.classList.toggle('on',e.id=='p-'+pg));

 $('ops').classList.toggle('on',['operations','market-surge','league-projections','grid-projections','cyber-monday'].includes(pg));
 window.scrollTo(0,0);if(done[pg])return;done[pg]=1;const el=$('p-'+pg);el.innerHTML='<div class="empty">LOADING…</div>';
 if(pg=='league-projections'){el.innerHTML=lp();lpLive();return}
 if(pg=='grid-projections'){const s=await load();el.innerHTML=gp(s);return}

 if(pg=='operations'){el.innerHTML=opsIndex();return}
 if(pg=='matchups'){const s=await load();el.innerHTML=matchPg(s);return}

 if(pg=='rules'){el.innerHTML=rules();return}

 const s=await load();
 if(pg=='home'){el.innerHTML=HOME(s);newsInit();calBind()}
 if(pg=='standings')el.innerHTML=standings(s);
 if(pg=='transactions'){el.innerHTML=txPage(s);$('txf').onclick=e=>{const f=e.target.dataset.f;if(!f)return;document.querySelectorAll('#txf button').forEach(b=>b.classList.toggle('on',b.dataset.f==f));$('txl').innerHTML=feed(s,80,f)}}
 if(pg=='market-surge'){el.innerHTML=market(s);marketCalc(s);$('mr').onclick=()=>marketCalc(s);$('draw').onclick=drawWin}}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#/"]');if(a&&location.hash==a.getAttribute('href'))route()});
document.addEventListener('click',e=>{const th=e.target.closest('th[data-k]');if(!th)return;const tb=th.closest('table'),bd=tb&&tb.querySelector('tbody');if(!bd)return;
 const idx=[...th.parentNode.children].indexOf(th),dir=th.dataset.cur?(th.dataset.cur=='a'?'d':'a'):(th.dataset.def||'d');th.dataset.cur=dir;
 const val=r=>{const c=r.cells[idx];if(!c)return '';return c.dataset.v!==undefined?parseFloat(c.dataset.v):c.textContent.trim()};
 [...bd.rows].sort((x,y)=>{const a=val(x),b=val(y),m=(typeof a=='number'&&!isNaN(a)&&typeof b=='number'&&!isNaN(b))?a-b:String(a).localeCompare(String(b));return dir=='a'?m:-m}).forEach(r=>bd.appendChild(r));
 tb.querySelectorAll('th[data-k]').forEach(h=>h.classList.remove('sa','sd'));th.classList.add(dir=='a'?'sa':'sd')});
